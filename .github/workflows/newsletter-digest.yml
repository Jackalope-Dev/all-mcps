name: 📰 Weekly Newsletter Digest

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Newsletter Digest API
        run: |
          curl -f -X POST https://allmcps.com/api/cron/newsletter-digest \
          -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}"
