name: 🔄 Autonomous Health Check Cron

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows you to trigger it manually for testing

jobs:
  run-health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Check API
        run: |
          curl -f -X POST https://allmcps.com/api/cron/health \
          -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}"

      # NOTE: The 6x-daily Twitter highlight post lives in its own workflow
      # (.github/workflows/twitter-highlight.yml) on a dedicated 0,4,8,12,16,20
      # UTC schedule. It used to be a step here guarded by a "minute < 15"
      # window, but GitHub's routine scheduling delay pushed the top-of-hour run
      # past that window and silently skipped whole 4-hour blocks.

