name: 🧪 E2B Stdio Verification Verification

# Graduated (see app/api/cron/stdio-verify/result — 'ok' results promote into
# servers.tools/tools_source). Verifies stdio MCP listings by actually
# installing and running them in an E2B sandbox (initialize -> tools/list over
# stdio), instead of trusting README-parsed tool guesses.
#
# Runs daily over the most-used unverified stdio listings first (/batch orders
# LLM-confirmed installs, then never-tested, then by demand) — daily defaults
# are concurrency 10, 45min budget, batch 50, overridable with the
# E2B_DAILY_* repo variables to keep E2B cost predictable. A manual dispatch with
# larger inputs is still how to drain a big backlog fast (e.g. right after a
# schema change makes a lot of the catalog newly re-claimable).
#
# Runs a concurrency pool that drains up to batch_size (or until
# run_budget_minutes is hit) — see scripts/e2b-stdio-verify.mjs. Manual-dispatch
# concurrency default (15) sits a few sandboxes below E2B Hobby's
# 20-concurrent-sandbox free-tier cap as headroom.
#
# Needs the E2B_API_KEY repo secret (E2B's SDK doesn't work inside Cloudflare
# Workers, so this can't run as a Worker cron — see scripts/e2b-stdio-verify.mjs).
# Manual dispatch: Actions → this workflow → "Run workflow".
on:
  schedule:
    - cron: '0 6 * * *' # Daily, 06:00 UTC.
  workflow_dispatch:
    inputs:
      concurrency:
        description: 'Sandboxes to run at once (stay a few below your E2B plan''s concurrent-sandbox cap)'
        required: false
        default: '15'
      run_budget_minutes:
        description: 'Stop starting new listings after this many minutes (in-flight ones still finish)'
        required: false
        default: '300'
      batch_size:
        description: 'Listings fetched per page from the backlog (capped at 100 by the endpoint)'
        required: false
        default: '100'

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    # Padded above the manual-dispatch run_budget_minutes default so the job
    # timeout itself is never what cuts a run short — the script's own budget
    # check is the one meant to bound this.
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run E2B stdio verification
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          ALLMCPS_CRON_SECRET: ${{ secrets.CRON_SECRET || secrets.ADMIN_SECRET }}
          # Optional custom sandbox with uv/python baked in (scripts/e2b-template).
          # Unset falls back to E2B's base image with uv bootstrapped per run.
          E2B_TEMPLATE: ${{ vars.E2B_TEMPLATE }}
          # workflow_dispatch inputs are empty on a schedule trigger, so these
          # fall back to the daily defaults: repo variables when set (Settings →
          # Variables), else concurrency 10 for 45 minutes. Verified tools are
          # now what makes a thin listing indexable (lib/listingIndexability.ts),
          # so the daily run was raised from 5 sandboxes for 15 minutes; lower
          # the variables if E2B cost matters more than coverage.
          CONCURRENCY: ${{ github.event.inputs.concurrency || vars.E2B_DAILY_CONCURRENCY || '10' }}
          RUN_BUDGET_MINUTES: ${{ github.event.inputs.run_budget_minutes || vars.E2B_DAILY_BUDGET_MINUTES || '45' }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || vars.E2B_DAILY_BATCH_SIZE || '50' }}
        run: node scripts/e2b-stdio-verify.mjs
