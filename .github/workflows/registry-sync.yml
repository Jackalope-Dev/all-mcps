name: 🔄 Registry Sync (weekly)

# Pulls new listings from the official MCP Registry (auto-approved, status='active')
# and from the community README sources (status='pending', existing admin queue) —
# see scripts/ingest-sources.mjs.
#
# pulsemcp was manually validated
# across several `--only=pulsemcp` dry runs on 2026-08-26 (quality floor, dedup,
# duplicate-flag corroboration, and retry/reliability handling against its flaky
# API all confirmed working) and is now included in the unattended weekly run.
# It always lands 'pending' regardless — see /api/cron/auto-promote for how
# pending listings go live without further human involvement.
#
# Requires a CLOUDFLARE_API_TOKEN repo secret scoped to D1 read/write on the
# all-mcps database (Account Settings > API Tokens > Create Token > "Edit
# Cloudflare Workers" template covers D1, or a custom token with the
# "D1 Edit" permission). Without it this job fails at the wrangler auth step.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch: # Allows manual triggering for testing

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22 # wrangler requires >=22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ingest and apply new listings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/ingest-sources.mjs --apply

      - name: Upload generated SQL as a run artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ingest-sql
          path: drizzle/ingest-*.sql
          if-no-files-found: ignore
          retention-days: 90
