name: 🔄 Registry Sync (weekly)

# Pulls new listings from the official MCP Registry and the community README
# sources — see scripts/ingest-sources.mjs. Everything lands 'pending'; the
# stale sweep, Jev triage and the imported-listing gate (lib/autoDecision.ts)
# publish what clears the bar. PulseMCP was dropped on 2026-10-13: its free
# v0beta API was sunset and v0.1 requires a paid key.
#
# Requires a CLOUDFLARE_API_TOKEN repo secret scoped to D1 read/write on the
# all-mcps database (Account Settings > API Tokens > Create Token > "Edit
# Cloudflare Workers" template covers D1, or a custom token with the
# "D1 Edit" permission). Without it this job fails at the wrangler auth step.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch: # Allows manual triggering for testing

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22 # wrangler requires >=22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Ingest and apply new listings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Jev duplicate/relevance checks at import; without it they're skipped.
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: node scripts/ingest-sources.mjs --apply

      - name: Upload generated SQL as a run artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ingest-sql
          path: drizzle/ingest-*.sql
          if-no-files-found: ignore
          retention-days: 90
