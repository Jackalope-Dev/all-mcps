name: 🧠 Backfill AI Content

# Manual-only. Drains the AI content backlog (summary / overview / use cases /
# features / LLM-validated install command per listing) by looping the
# /api/cron/ai-content endpoint until both the content and install-check
# backlogs are empty. The Cloudflare Worker cron already runs this pass every
# 4h automatically (custom-worker.ts) — this workflow is for draining a large
# backlog in one run without waiting weeks (initial import, or a schema change
# like installExtractedAt that makes the whole catalog re-claimable for one
# specific field without re-running the rest of the content pipeline). Uses
# the CRON_SECRET repo secret; the LLM key lives in the Worker, so
# nothing extra to configure. Trigger it from the GitHub mobile app or web UI:
# Actions → this workflow → "Run workflow".
on:
  workflow_dispatch:
    inputs:
      max_calls:
        description: 'Safety cap on endpoint calls (each processes up to ~12 listings)'
        required: false
        default: '400'
      parallel_calls:
        description: 'Concurrent calls per round. CAUTION: this endpoint runs in the same Worker instance as live site traffic, not an isolated queue — 3 correlated with Worker memory-limit/hung-request errors on real page loads during a live run. Keep at 1 until backfill load can be isolated from production.'
        required: false
        default: '1'

jobs:
  backfill:
    runs-on: ubuntu-latest
    # Each call runs up to ~12 sequential LLM generations; draining ~3k listings
    # is a few hundred calls. Well under GitHub's 6h job ceiling, capped for safety.
    timeout-minutes: 350
    steps:
      - name: Drain AI content backlog
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET || secrets.ADMIN_SECRET }}
          MAX_CALLS: ${{ github.event.inputs.max_calls }}
          PARALLEL_CALLS: ${{ github.event.inputs.parallel_calls }}
        run: |
          set -uo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Neither CRON_SECRET nor ADMIN_SECRET repo secret is set."
            exit 1
          fi
          endpoint="https://allmcps.com/api/cron/ai-content"
          max="${MAX_CALLS:-400}"
          parallel="${PARALLEL_CALLS:-3}"
          idle=0
          total=0
          call=0
          # Fires $parallel requests concurrently per round instead of one at a
          # time. Safe against double-claiming: the endpoint's claim step is a
          # single atomic UPDATE ... WHERE id IN (subquery), not a separate
          # SELECT-then-write, so overlapping requests can't grab the same row.
          while [ "$call" -lt "$max" ]; do
            tmpdir=$(mktemp -d)
            pids=()
            for _ in $(seq 1 "$parallel"); do
              call=$((call + 1))
              if [ "$call" -gt "$max" ]; then break; fi
              (
                if ! curl -fsS -X POST "$endpoint" -H "Authorization: Bearer $CRON_SECRET" -o "$tmpdir/$call.json"; then
                  echo '{}' > "$tmpdir/$call.json"
                fi
              ) &
              pids+=($!)
            done
            for pid in "${pids[@]}"; do wait "$pid"; done

            round_enriched=0
            round_thin=0
            round_failed=0
            remaining="?"
            install_remaining="?"
            stopped="false"
            for f in "$tmpdir"/*.json; do
              [ -e "$f" ] || continue
              resp=$(cat "$f")
              round_enriched=$((round_enriched + $(echo "$resp" | jq -r '.enriched // 0')))
              round_thin=$((round_thin + $(echo "$resp" | jq -r '.skippedThin // 0')))
              round_failed=$((round_failed + $(echo "$resp" | jq -r '.failed // 0')))
              r=$(echo "$resp" | jq -r '.remaining // "?"')
              ir=$(echo "$resp" | jq -r '.installRemaining // "?"')
              [ "$r" != "?" ] && remaining="$r"
              [ "$ir" != "?" ] && install_remaining="$ir"
              [ "$(echo "$resp" | jq -r '.budgetStopped // false')" = "true" ] && stopped="true"
            done
            rm -rf "$tmpdir"
            total=$((total + round_enriched))
            echo "Through call $call: +$round_enriched enriched, $round_thin thin-skipped, $round_failed failed this round | remaining=$remaining, install_remaining=$install_remaining | run total=$total"

            # Both counters must clear — installExtractedAt backfilling reclaims
            # already-enriched rows too, so `remaining` alone can hit 0 long
            # before install_remaining does.
            if [ "$remaining" = "0" ] && [ "$install_remaining" = "0" ]; then
              echo "✓ Catalog fully enriched and install-checked."
              break
            fi
            if [ "$round_enriched" = "0" ] && [ "$round_thin" = "0" ]; then
              idle=$((idle + 1))
              if [ "$stopped" = "true" ]; then
                echo "Endpoint stopped early (likely LLM budget/outage) — backing off 30s."
                sleep 30
              fi
              if [ "$idle" -ge 4 ]; then
                echo "::warning::No progress across 4 rounds — stopping. Re-run later to continue."
                break
              fi
            else
              idle=0
            fi
            sleep 2
          done
          echo "Done. $total listings enriched this run."
