name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck & Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Generate Cloudflare Types
        run: npm run cf-typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (Biome)
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Dry-run OpenNext Cloudflare Build
        # This used to fail closed here in CI needing a CLOUDFLARE_API_TOKEN
        # with Workers-edge-preview permission the repo's D1-scoped token
        # doesn't have — root cause was WORKER_SELF_REFERENCE (a runtime-only
        # service binding, no local emulation) being present in
        # wrangler.build.jsonc even though the build never touches it. Fixed
        # there (confirmed 2026-09-07) instead of widening a token's scope —
        # this step needs no Cloudflare credentials at all now.
        run: npx opennextjs-cloudflare build
