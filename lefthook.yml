# Lefthook git hooks. Installed by `bun install` (prepare). Docs: https://lefthook.dev
# pre-commit touches only staged files; pre-push checks what the pushed commits
# can break (scripts/pre-push.mjs). CI runs the full `verify` gate.

pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,mjs,ts,mts,jsx,tsx,json,jsonc,css}"
      run: node scripts/run-bin.mjs @biomejs/biome check --write --diagnostic-level=error --no-errors-on-unmatched --staged {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    verify:
      run: node scripts/pre-push.mjs
    secrets:
      run: node scripts/check-secrets.mjs
